name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  audit:
    runs-on: macos-latest
    env:
      HOMEBREW_NO_AUTO_UPDATE: '1'
      HOMEBREW_NO_ANALYTICS: '1'
    steps:
      - uses: actions/checkout@v4
      - name: Tap this checkout
        run: brew tap harinaralasetty/tap "$GITHUB_WORKSPACE"
      - run: brew style harinaralasetty/tap
      - run: brew audit --strict --online --formula harinaralasetty/tap/underhood
      - run: brew audit --strict --online --cask harinaralasetty/tap/caffeinate-ui
      - name: Install and test the underhood formula
        run: brew install harinaralasetty/tap/underhood && brew test harinaralasetty/tap/underhood
